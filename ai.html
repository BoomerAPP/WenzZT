<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WenzZ AI - WenzZTools</title>
<link rel="stylesheet" href="style.css">
<style>
.ai-page{max-width:520px;margin:0 auto;padding:16px 16px 160px;display:flex;flex-direction:column;min-height:100vh}
.ai-header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px;border-bottom:1px solid var(--border);margin-bottom:14px}
.ai-header-left{display:flex;align-items:center;gap:10px}
.ai-avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--bg-primary);font-size:20px;box-shadow:var(--glow);position:relative}
.ai-avatar::after{content:'';position:absolute;bottom:0;right:0;width:11px;height:11px;background:#10b981;border:2px solid var(--bg-primary);border-radius:50%}
.ai-info h2{font-size:15px;font-weight:700}
.ai-info p{font-size:11px;color:#10b981}
.ai-clear{width:38px;height:38px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.ai-clear:hover{background:var(--bg-hover);border-color:#ef4444;color:#ef4444}
.ai-clear svg{width:16px;height:16px}
.chat-container{flex:1;display:flex;flex-direction:column;gap:14px}
.chat-welcome{text-align:center;padding:30px 16px}
.chat-welcome-icon{font-size:52px;margin-bottom:12px}
.chat-welcome h3{font-size:19px;font-weight:700;margin-bottom:6px}
.chat-welcome p{font-size:12.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:22px}
.suggestions{display:flex;flex-direction:column;gap:8px;max-width:340px;margin:0 auto}
.suggestion-btn{padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;color:var(--text-primary);font-size:12.5px;text-align:left;cursor:pointer;transition:var(--transition);font-family:inherit}
.suggestion-btn:hover{background:var(--bg-hover);border-color:var(--border-light);transform:translateY(-1px)}
.suggestion-btn::before{content:'💡 '}
.msg{display:flex;gap:10px;animation:slideIn .3s ease;max-width:100%}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.msg.user .msg-avatar{background:var(--accent);color:var(--bg-primary)}
.msg.ai .msg-avatar{background:var(--bg-card);border:1px solid var(--border);color:var(--accent)}
.msg-content{max-width:calc(100% - 90px)}
.msg-bubble{padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.msg.user .msg-bubble{background:var(--accent);color:var(--bg-primary);border-bottom-right-radius:4px}
.msg.ai .msg-bubble{background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);border-bottom-left-radius:4px}
.msg-actions{display:flex;gap:6px;margin-top:6px;opacity:0;transition:opacity .2s}
.msg:hover .msg-actions,.msg:active .msg-actions{opacity:1}
.msg-action-btn{padding:3px 8px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:10px;cursor:pointer;transition:var(--transition);font-family:inherit}
.typing-dots{display:inline-flex;gap:4px;align-items:center;padding:4px 0}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--text-secondary);animation:bounce 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.ai-input-box{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:500px;background:var(--bg-card);border:1px solid var(--border);border-radius:22px;padding:6px 6px 6px 16px;display:flex;align-items:flex-end;gap:6px;box-shadow:0 4px 24px rgba(0,0,0,.4);z-index:90}
.ai-input-box textarea{flex:1;background:transparent;border:none;color:var(--text-primary);font-size:13.5px;font-family:inherit;outline:none;resize:none;max-height:100px;padding:8px 0;line-height:1.4}
.ai-input-box textarea::placeholder{color:var(--text-muted)}
.ai-send{width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;color:var(--bg-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0}
.ai-send:disabled{opacity:.4;cursor:not-allowed}
.ai-send svg{width:16px;height:16px}
</style>
</head>
<body>

<div class="ai-page">
  <div class="ai-header">
    <div class="ai-header-left">
      <div class="ai-avatar">🤖</div>
      <div class="ai-info">
        <h2>WenzZ AI</h2>
        <p>● Online</p>
      </div>
    </div>
    <button class="ai-clear" onclick="clearChat()" title="Hapus chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    </button>
  </div>
  <div class="chat-container" id="chatContainer">
    <div class="chat-welcome" id="chatWelcome">
      <div class="chat-welcome-icon">🤖</div>
      <h3>Halo, aku WenzZ AI!</h3>
      <p>Aku siap bantu kamu. Tanya apapun, atau pilih salah satu topik di bawah.</p>
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion('Apa itu WenzZTools?')">Apa itu WenzZTools?</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Bantu aku bikin CV menarik')">Bantu aku bikin CV menarik</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Tips bikin password kuat')">Tips bikin password kuat</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Rekomendasi lagu untuk belajar')">Rekomendasi lagu untuk belajar</button>
      </div>
    </div>
  </div>
</div>

<div class="ai-input-box">
  <textarea id="aiInput" placeholder="Tanya apapun..." rows="1" onkeydown="handleInputKey(event)" oninput="autoResize(this)"></textarea>
  <button class="ai-send" id="sendBtn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
  </button>
</div>

<div class="wenzz-credit">© 2025 WenzZTools • by <span>@WenzZDev</span></div>

<nav class="liquid-nav liquid-nav-5">
  <a class="nav-btn" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>
  <a class="nav-btn" href="tools.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Tools</span></a>
  <a class="nav-btn nav-center active" href="ai.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>AI</span></a>
  <a class="nav-btn" href="riwayat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>Riwayat</span></a>
  <a class="nav-btn" href="profil.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>Profil</span></a>
</nav>

<script>
var ENCODED_KEY = 'c2stb3ItdjEtNDQxZDA5NjdjMDA1ZmRkNTU0NGUyZjY3MTc3MzQyZjYwZjc2OTQwMjgwNjBmNDEyMjUxYjUxYTJkYjkzMWYwNA';
var MODEL = 'openrouter/free';
var API_URL = 'https://openrouter.ai/api/v1/chat/completions';
var TIMEOUT_MS = 30000;
var messages = [];
var isTyping = false;

function getKey() {
  try { return atob(ENCODED_KEY); } catch(e) { return ''; }
}

function esc(str) {
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function scrollDown() {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function renderMsg(role, text, anim) {
  if (anim === undefined) anim = true;
  var container = document.getElementById('chatContainer');
  var welcome = document.getElementById('chatWelcome');
  if (welcome) welcome.style.display = 'none';
  var div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  var av = role === 'user' ? '<div class="msg-avatar">👤</div>' : '<div class="msg-avatar">🤖</div>';
  var act = role === 'ai' ? '<div class="msg-actions"><button class="msg-action-btn" onclick="copyMsg(this)">📋 Copy</button></div>' : '';
  div.innerHTML = av + '<div class="msg-content"><div class="msg-bubble">' + esc(text) + '</div>' + act + '</div>';
  container.appendChild(div);
  if (anim) scrollDown();
  return div;
}

function saveChat() {
  localStorage.setItem('wenzz-ai-chat', JSON.stringify(messages.slice(-50)));
}

function loadChat() {
  var saved = localStorage.getItem('wenzz-ai-chat');
  if (saved) {
    try {
      messages = JSON.parse(saved);
      if (messages.length > 0) {
        document.getElementById('chatWelcome').style.display = 'none';
        messages.forEach(function(m) { renderMsg(m.role, m.text, false); });
        scrollDown();
      }
    } catch(e) {}
  }
  var theme = localStorage.getItem('wenzz-theme');
  if (theme) document.body.classList.add(theme);
}

async function sendMessage() {
  var input = document.getElementById('aiInput');
  var text = input.value.trim();
  if (!text || isTyping) return;
  var key = getKey();
  if (!key || key.length < 20) { alert('API key belum valid'); return; }

  isTyping = true;
  input.value = '';
  autoResize(input);
  document.getElementById('sendBtn').disabled = true;

  messages.push({ role: 'user', text: text });
  renderMsg('user', text);
  saveChat();

  var aiDiv = renderMsg('ai', '');
  var bubble = aiDiv.querySelector('.msg-bubble');
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  var controller = new AbortController();
  var timeoutId = setTimeout(function() { controller.abort(); }, TIMEOUT_MS);

  try {
    var response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key,
        'HTTP-Referer': 'https://my-wenzztools.vercel.app',
        'X-Title': 'WenzZTools'
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: 'system', content: 'Kamu adalah WenzZ AI. Jawab ramah, ringkas, bahasa Indonesia santai.' }].concat(messages.map(function(m) {
          return { role: m.role === 'user' ? 'user' : 'assistant', content: m.text };
        })),
        temperature: 0.9,
        max_tokens: 1000
      }),
      signal: controller.signal
    });

    clearTimeout(timeoutId);

    if (!response.ok) {
      var errData = await response.json().catch(function() { return {}; });
      throw new Error((errData.error && errData.error.message) || ('API error ' + response.status));
    }

    var data = await response.json();
    var aiText = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || 'Maaf, aku nggak bisa jawab.';

    bubble.innerHTML = '';
    typeText(bubble, aiText, function() {
      messages.push({ role: 'ai', text: aiText });
      saveChat();
      isTyping = false;
      document.getElementById('sendBtn').disabled = false;
    });

  } catch(err) {
    clearTimeout(timeoutId);
    var msg = err.name === 'AbortError' ? '⏱️ Timeout. Server lambat, coba lagi.' : ('❌ Error: ' + err.message);
    bubble.innerHTML = msg;
    isTyping = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

function typeText(el, text, cb) {
  var i = 0;
  function type() {
    if (i < text.length) {
      el.textContent = text.slice(0, i + 1);
      i++;
      scrollDown();
      setTimeout(type, 10);
    } else {
      if (cb) cb();
    }
  }
  type();
}

function sendSuggestion(text) {
  document.getElementById('aiInput').value = text;
  sendMessage();
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function copyMsg(btn) {
  var bubble = btn.closest('.msg').querySelector('.msg-bubble');
  var text = bubble.textContent;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function() {
      btn.textContent = '✅ Copied!';
      setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      btn.textContent = '✅ Copied!';
      setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
    } catch(e) {}
    document.body.removeChild(ta);
  }
}

function clearChat() {
  if (!confirm('Hapus semua riwayat chat?')) return;
  messages = [];
  localStorage.removeItem('wenzz-ai-chat');
  location.reload();
}

loadChat();
</script>
</body>
</html>
