<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QR Code Generator - WenzZTools</title>
<link rel="stylesheet" href="../style.css">
<style>
.tool-page {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 120px;
}
.tool-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.back-btn {
  width: 40px;
  height: 40px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: var(--transition);
}
.back-btn:hover { background: var(--bg-hover); }
.back-btn svg { width: 20px; height: 20px; }
.tool-title {
  font-size: 20px;
  font-weight: 700;
}
.tool-sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.qr-input-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.qr-input-wrap label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.qr-input-wrap textarea,
.qr-input-wrap input {
  width: 100%;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: var(--transition);
  resize: none;
}
.qr-input-wrap textarea:focus,
.qr-input-wrap input:focus {
  border-color: var(--accent);
  box-shadow: var(--glow);
}
.qr-input-wrap textarea {
  min-height: 80px;
}
.btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: var(--bg-primary);
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  margin-top: 12px;
}
.btn:hover { opacity: 0.9; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-outline {
  background: transparent;
  border: 1px solid var(--border-light);
  color: var(--text-primary);
}
.qr-result {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-top: 16px;
}
.qr-result.show { display: flex; }
#qrCanvas {
  background: #fff;
  padding: 12px;
  border-radius: 12px;
  max-width: 100%;
  height: auto;
}
.qr-hint {
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
}
</style>
</head>
<body>

<div class="tool-page">

  <div class="tool-header">
    <a href="../index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <div>
      <h1 class="tool-title">QR Code Generator</h1>
      <p class="tool-sub">Buat QR Code dari teks / link</p>
    </div>
  </div>

  <div class="qr-input-wrap">
    <label for="qrText">Teks atau Link</label>
    <textarea id="qrText" placeholder="Contoh: https://wenzztools.vercel.app"></textarea>
    <button class="btn" onclick="generateQR()">Generate QR</button>
  </div>

  <div class="qr-result" id="qrResult">
    <canvas id="qrCanvas"></canvas>
    <p class="qr-hint">Tap lama gambar → Simpan / Bagikan</p>
    <button class="btn btn-outline" onclick="downloadQR()">⬇️ Download PNG</button>
    <button class="btn btn-outline" onclick="resetQR()">🔄 Reset</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
function generateQR() {
  const text = document.getElementById('qrText').value.trim();
  if (!text) {
    alert('Masukkan teks atau link dulu!');
    return;
  }
  
  const canvas = document.getElementById('qrCanvas');
  const qr = new QRious({
    element: canvas,
    value: text,
    size: 280,
    background: '#ffffff',
    foreground: '#000000',
    level: 'H'
  });
  
  document.getElementById('qrResult').classList.add('show');
}

function downloadQR() {
  const canvas = document.getElementById('qrCanvas');
  const link = document.createElement('a');
  link.download = 'wenzz-qr.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function resetQR() {
  document.getElementById('qrText').value = '';
  document.getElementById('qrResult').classList.remove('show');
}

// Enter = generate
document.getElementById('qrText').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    generateQR();
  }
});
</script>
<div class="wenzz-credit">© 2026 WenzZTools • by <span>@WenzZ</span></div>
<script>
// Auto-sync tema dari homepage
(function() {
  const saved = localStorage.getItem('wenzz-theme');
  if (saved) {
    document.body.classList.add(saved);
  }
})();
</script>
</body>
</html>
