<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BRAT Generator - WenzZTools</title>
<link rel="stylesheet" href="../style.css">
<style>
.tool-page { max-width: 520px; margin: 0 auto; padding: 20px 16px 120px; }
.tool-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.back-btn { width: 40px; height: 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; color: var(--text-primary); display: flex; align-items: center; justify-content: center; text-decoration: none; transition: var(--transition); flex-shrink: 0; }
.back-btn:hover { background: var(--bg-hover); }
.back-btn svg { width: 20px; height: 20px; }
.tool-title { font-size: 20px; font-weight: 700; }
.tool-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.section h3 { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
.field input, .field textarea { width: 100%; padding: 11px 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none; transition: var(--transition); box-sizing: border-box; resize: vertical; }
.field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: var(--glow); }
.field textarea { min-height: 80px; }

.color-row { display: flex; gap: 8px; flex-wrap: wrap; }
.color-option { width: 42px; height: 42px; border-radius: 10px; border: 2px solid var(--border); cursor: pointer; transition: var(--transition); }
.color-option:hover { transform: scale(1.08); }
.color-option.active { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }

.size-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.size-btn { padding: 10px; background: var(--bg-secondary); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; transition: var(--transition); font-family: inherit; text-align: center; }
.size-btn.active { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }

.btn-main { width: 100%; padding: 14px; background: var(--accent); color: var(--bg-primary); border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; transition: var(--transition); margin-top: 6px; font-family: inherit; }
.btn-main:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-outline { width: 100%; padding: 12px; background: transparent; color: var(--text-primary); border: 1px solid var(--border-light); border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transition); margin-top: 8px; font-family: inherit; }
.btn-outline:hover { background: var(--bg-hover); }

.preview-wrap { display: none; margin-top: 16px; }
.preview-wrap.show { display: block; }
.preview-canvas { width: 100%; border-radius: 12px; background: #000; display: block; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
</style>
</head>
<body>

<div class="tool-page">

  <div class="tool-header">
    <a href="../tools.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <div>
      <h1 class="tool-title">BRAT Generator</h1>
      <p class="tool-sub">Teks gaya BRAT aesthetic</p>
    </div>
  </div>

  <div class="section">
    <h3>✏️ Teks BRAT</h3>
    <div class="field">
      <label>Teks kamu</label>
      <textarea id="bratText" maxlength="80" placeholder="tulis teks di sini..." oninput="updateChar()">wenzz tools</textarea>
      <div style="font-size:10px;color:var(--text-muted);text-align:right;margin-top:4px;"><span id="charCount">0</span>/80</div>
    </div>
  </div>

  <div class="section">
    <h3>🎨 Warna Background</h3>
    <div class="color-row">
      <div class="color-option active" style="background:#ffffff;" data-color="#ffffff" onclick="pickColor(this)"></div>
      <div class="color-option" style="background:#8ace00;" data-color="#8ace00" onclick="pickColor(this)"></div>
      <div class="color-option" style="background:#ff6b9d;" data-color="#ff6b9d" onclick="pickColor(this)"></div>
      <div class="color-option" style="background:#3b82f6;" data-color="#3b82f6" onclick="pickColor(this)"></div>
      <div class="color-option" style="background:#000000;" data-color="#000000" onclick="pickColor(this)"></div>
      <div class="color-option" style="background:#fbbf24;" data-color="#fbbf24" onclick="pickColor(this)"></div>
    </div>
  </div>

  <div class="section">
    <h3>📐 Ukuran Teks</h3>
    <div class="size-row">
      <div class="size-btn" data-size="60" onclick="pickSize(this)">Kecil</div>
      <div class="size-btn active" data-size="90" onclick="pickSize(this)">Sedang</div>
      <div class="size-btn" data-size="120" onclick="pickSize(this)">Besar</div>
    </div>
  </div>

  <button class="btn-main" onclick="generateBrat()">🎨 Generate BRAT</button>

  <div class="preview-wrap" id="previewWrap">
    <canvas id="bratCanvas" class="preview-canvas"></canvas>
    <button class="btn-outline" onclick="downloadBrat()">⬇️ Download PNG</button>
    <button class="btn-outline" onclick="resetBrat()">🔄 Reset</button>
  </div>

</div>

<div class="wenzz-credit">© 2025 WenzZTools • by <span>@WenzZDev</span></div>

<script>
(function() {
  const theme = localStorage.getItem('wenzz-theme');
  if (theme) document.body.classList.add(theme);
})();

let bgColor = '#ffffff';
let fontSize = 90;

function updateChar() {
  const len = document.getElementById('bratText').value.length;
  document.getElementById('charCount').textContent = len;
}

function pickColor(el) {
  document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  bgColor = el.dataset.color;
}

function pickSize(el) {
  document.querySelectorAll('.size-btn').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  fontSize = parseInt(el.dataset.size);
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  let line = '';
  const lines = [];

  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && n > 0) {
      lines.push(line.trim());
      line = words[n] + ' ';
    } else {
      line = testLine;
    }
  }
  lines.push(line.trim());
  return lines;
}

function generateBrat() {
  const text = document.getElementById('bratText').value.trim().toLowerCase();
  if (!text) { alert('Tulis teks dulu!'); return; }

  const canvas = document.getElementById('bratCanvas');
  const size = 1080;
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, size, size);

  // Pilih warna teks otomatis (hitam/putih) sesuai kontras
  const isLight = ['#ffffff', '#8ace00', '#fbbf24', '#ff6b9d'].includes(bgColor.toLowerCase());
  ctx.fillStyle = isLight ? '#000000' : '#ffffff';

  // Font BRAT — sans-serif, lowercase, kerning ketat
  ctx.font = 'bold ' + fontSize + 'px Arial, Helvetica, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Auto-size kalau teks panjang
  let currentSize = fontSize;
  const maxWidth = size - 120;
  let lines = wrapText(ctx, text, maxWidth);

  // Kalau masih kepanjangan, kecilin font
  while (lines.length > 6 && currentSize > 40) {
    currentSize -= 10;
    ctx.font = 'bold ' + currentSize + 'px Arial, Helvetica, sans-serif';
    lines = wrapText(ctx, text, maxWidth);
  }

  const lineHeight = currentSize * 1.05;
  const totalHeight = (lines.length - 1) * lineHeight;
  const startY = size / 2 - totalHeight / 2;

  // Efek blur/shadow untuk BRAT aesthetic
  ctx.shadowColor = isLight ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.15)';
  ctx.shadowBlur = 3;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

  lines.forEach((line, i) => {
    ctx.fillText(line, size / 2, startY + (i * lineHeight));
  });

  // Reset shadow
  ctx.shadowBlur = 0;

  // Watermark kecil
  ctx.font = '18px sans-serif';
  ctx.globalAlpha = 0.35;
  ctx.fillText('wenzztools', size / 2, size - 40);
  ctx.globalAlpha = 1;

  document.getElementById('previewWrap').classList.add('show');
  document.getElementById('previewWrap').scrollIntoView({ behavior: 'smooth' });
}

function downloadBrat() {
  const canvas = document.getElementById('bratCanvas');
  const link = document.createElement('a');
  link.download = 'brat-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('⬇️ Download dimulai');
}

function resetBrat() {
  document.getElementById('bratText').value = '';
  document.getElementById('previewWrap').classList.remove('show');
  document.getElementById('charCount').textContent = '0';
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bg-card);color:var(--text-primary);padding:12px 20px;border-radius:12px;font-size:13px;border:1px solid var(--border-light);z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.6);';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

updateChar();
</script>
</body>
</html>
