<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QR Generator v2 - WenzZTools</title>
<link rel="stylesheet" href="../style.css">
<style>
.tool-page { max-width: 520px; margin: 0 auto; padding: 20px 16px 120px; }
.tool-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.back-btn { width: 40px; height: 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; color: var(--text-primary); display: flex; align-items: center; justify-content: center; text-decoration: none; transition: var(--transition); flex-shrink: 0; }
.back-btn:hover { background: var(--bg-hover); }
.back-btn svg { width: 20px; height: 20px; }
.tool-title { font-size: 20px; font-weight: 700; }
.tool-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.tab-bar { display: flex; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.tab-btn { flex: 1; padding: 9px; background: transparent; border: none; color: var(--text-secondary); font-size: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: var(--transition); font-family: inherit; }
.tab-btn.active { background: var(--accent); color: var(--bg-primary); }

.section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.section h3 { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
.field input, .field textarea, .field select { width: 100%; padding: 11px 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none; transition: var(--transition); box-sizing: border-box; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); box-shadow: var(--glow); }
.field textarea { min-height: 80px; }

.color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.color-item { aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--border); cursor: pointer; transition: var(--transition); position: relative; }
.color-item:hover { transform: scale(1.08); }
.color-item.active { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
.color-item.active::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 14px; font-weight: 700; text-shadow: 0 0 4px rgba(0,0,0,0.8); }

.size-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.size-btn { padding: 10px 6px; background: var(--bg-secondary); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text-secondary); font-size: 11px; font-weight: 600; cursor: pointer; transition: var(--transition); font-family: inherit; text-align: center; }
.size-btn.active { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }

.level-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.level-btn { padding: 9px 4px; background: var(--bg-secondary); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text-secondary); font-size: 10.5px; font-weight: 600; cursor: pointer; transition: var(--transition); font-family: inherit; text-align: center; }
.level-btn.active { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }

.btn-main { width: 100%; padding: 14px; background: var(--accent); color: var(--bg-primary); border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; transition: var(--transition); margin-top: 6px; font-family: inherit; }
.btn-main:hover { opacity: 0.9; transform: translateY(-1px); }

.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btn-action { padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-primary); font-size: 12px; font-weight: 600; cursor: pointer; transition: var(--transition); font-family: inherit; }
.btn-action:hover { background: var(--bg-hover); border-color: var(--border-light); }
.btn-action.primary { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }

.preview-box { display: none; margin-top: 16px; text-align: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
.preview-box.show { display: block; }
#qrCanvas { background: #fff; padding: 12px; border-radius: 12px; max-width: 100%; height: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

.tips { background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 11px; color: var(--text-secondary); line-height: 1.5; }
.tips strong { color: #3b82f6; }
</style>
</head>
<body>

<div class="tool-page">

  <div class="tool-header">
    <a href="../tools.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <div>
      <h1 class="tool-title">QR Generator v2</h1>
      <p class="tool-sub">QR code custom warna & ukuran</p>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="pickPreset('text', this)">📝 Teks/Link</button>
    <button class="tab-btn" onclick="pickPreset('wifi', this)">📶 WiFi</button>
    <button class="tab-btn" onclick="pickPreset('contact', this)">👤 Kontak</button>
  </div>

  <div class="section">
    <h3>✏️ Konten</h3>

    <div id="presetText">
      <div class="field">
        <label>Teks / Link</label>
        <textarea id="qrText" placeholder="https://wenzztools.vercel.app" maxlength="1000">https://wenzztools.vercel.app</textarea>
      </div>
    </div>

    <div id="presetWifi" style="display:none;">
      <div class="field">
        <label>Nama WiFi (SSID)</label>
        <input type="text" id="wifiSSID" placeholder="Nama WiFi..." maxlength="50">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="text" id="wifiPass" placeholder="Password WiFi..." maxlength="50">
      </div>
      <div class="field">
        <label>Keamanan</label>
        <select id="wifiType">
          <option value="WPA">WPA / WPA2 / WPA3</option>
          <option value="WEP">WEP</option>
          <option value="nopass">Tanpa Password</option>
        </select>
      </div>
    </div>

    <div id="presetContact" style="display:none;">
      <div class="field">
        <label>Nama Lengkap</label>
        <input type="text" id="cName" placeholder="Nama..." maxlength="40">
      </div>
      <div class="field">
        <label>Nomor HP</label>
        <input type="tel" id="cPhone" placeholder="+62..." maxlength="20">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="cEmail" placeholder="email@example.com" maxlength="50">
      </div>
    </div>

  </div>

  <div class="section">
    <h3>🎨 Warna QR</h3>
    <div class="color-grid">
      <div class="color-item active" style="background:#000000;" data-color="#000000" onclick="pickColor(this, 'fg')"></div>
      <div class="color-item" style="background:#1a1a2e;" data-color="#1a1a2e" onclick="pickColor(this, 'fg')"></div>
      <div class="color-item" style="background:#8b5cf6;" data-color="#8b5cf6" onclick="pickColor(this, 'fg')"></div>
      <div class="color-item" style="background:#3b82f6;" data-color="#3b82f6" onclick="pickColor(this, 'fg')"></div>
      <div class="color-item" style="background:#10b981;" data-color="#10b981" onclick="pickColor(this, 'fg')"></div>
      <div class="color-item" style="background:#ef4444;" data-color="#ef4444" onclick="pickColor(this, 'fg')"></div>
    </div>
  </div>

  <div class="section">
    <h3>📐 Ukuran</h3>
    <div class="size-row">
      <div class="size-btn" data-size="200" onclick="pickSize(this)">Kecil</div>
      <div class="size-btn active" data-size="300" onclick="pickSize(this)">Sedang</div>
      <div class="size-btn" data-size="500" onclick="pickSize(this)">Besar</div>
    </div>
  </div>

  <div class="section">
    <h3>⚙️ Error Correction</h3>
    <div class="tips">
      <strong>Tips:</strong> Level tinggi (H) = QR lebih tahan rusak, tapi lebih padat. Bagus kalau QR mau ditempel di produk.
    </div>
    <div class="level-row">
      <div class="level-btn" data-level="L" onclick="pickLevel(this)">L (7%)</div>
      <div class="level-btn" data-level="M" onclick="pickLevel(this)">M (15%)</div>
      <div class="level-btn active" data-level="Q" onclick="pickLevel(this)">Q (25%)</div>
      <div class="level-btn" data-level="H" onclick="pickLevel(this)">H (30%)</div>
    </div>
  </div>

  <button class="btn-main" onclick="generateQR()">🎨 Generate QR</button>

  <div class="preview-box" id="previewBox">
    <canvas id="qrCanvas"></canvas>
    <div class="action-row">
      <button class="btn-action primary" onclick="downloadQR()">⬇️ PNG</button>
      <button class="btn-action" onclick="downloadSVG()">📐 SVG</button>
    </div>
  </div>

</div>

<div class="wenzz-credit">© 2025 WenzZTools • by <span>@WenzZDev</span></div>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
(function() {
  const theme = localStorage.getItem('wenzz-theme');
  if (theme) document.body.classList.add(theme);
})();

let preset = 'text';
let fgColor = '#000000';
let qrSize = 300;
let qrLevel = 'Q';
let currentQR = null;

function pickPreset(type, btn) {
  preset = type;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('presetText').style.display = type === 'text' ? 'block' : 'none';
  document.getElementById('presetWifi').style.display = type === 'wifi' ? 'block' : 'none';
  document.getElementById('presetContact').style.display = type === 'contact' ? 'block' : 'none';
}

function pickColor(el, type) {
  el.closest('.color-grid').querySelectorAll('.color-item').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  if (type === 'fg') fgColor = el.dataset.color;
}

function pickSize(el) {
  document.querySelectorAll('.size-btn').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  qrSize = parseInt(el.dataset.size);
}

function pickLevel(el) {
  document.querySelectorAll('.level-btn').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  qrLevel = el.dataset.level;
}

function getContent() {
  if (preset === 'text') {
    return document.getElementById('qrText').value.trim();
  }
  if (preset === 'wifi') {
    const ssid = document.getElementById('wifiSSID').value.trim();
    const pass = document.getElementById('wifiPass').value;
    const type = document.getElementById('wifiType').value;
    if (!ssid) return '';
    return 'WIFI:T:' + type + ';S:' + ssid + ';P:' + pass + ';;';
  }
  if (preset === 'contact') {
    const name = document.getElementById('cName').value.trim();
    const phone = document.getElementById('cPhone').value.trim();
    const email = document.getElementById('cEmail').value.trim();
    if (!name && !phone) return '';
    return 'BEGIN:VCARD\nVERSION:3.0\nFN:' + name + '\nTEL:' + phone + '\nEMAIL:' + email + '\nEND:VCARD';
  }
  return '';
}

function generateQR() {
  const content = getContent();
  if (!content) {
    showToast('⚠️ Isi konten dulu!');
    return;
  }

  const canvas = document.getElementById('qrCanvas');
  currentQR = new QRious({
    element: canvas,
    value: content,
    size: qrSize,
    background: '#ffffff',
    foreground: fgColor,
    level: qrLevel,
    padding: 16
  });

  document.getElementById('previewBox').classList.add('show');
  document.getElementById('previewBox').scrollIntoView({ behavior: 'smooth' });
  showToast('✅ QR berhasil dibuat!');
}

function downloadQR() {
  if (!currentQR) { showToast('⚠️ Generate QR dulu'); return; }
  const canvas = document.getElementById('qrCanvas');
  const link = document.createElement('a');
  link.download = 'wenzz-qr-' + Date.now() + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('⬇️ PNG ke-download!');
}

function downloadSVG() {
  if (!currentQR) { showToast('⚠️ Generate QR dulu'); return; }

  const canvas = document.getElementById('qrCanvas');
  const dataUrl = canvas.toDataURL('image/png');
  const w = canvas.width;
  const h = canvas.height;

  const svg = '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">\n' +
    '  <image width="' + w + '" height="' + h + '" xlink:href="' + dataUrl + '"/>\n' +
    '</svg>';

  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'wenzz-qr-' + Date.now() + '.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📐 SVG ke-download!');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bg-card);color:var(--text-primary);padding:12px 20px;border-radius:12px;font-size:13px;border:1px solid var(--border-light);z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.6);';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
</script>
</body>
</html>
