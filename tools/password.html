<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Password Generator - WenzZTools</title>
<link rel="stylesheet" href="../style.css">
<style>
.tool-page {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 120px;
}
.tool-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.back-btn {
  width: 40px;
  height: 40px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: var(--transition);
}
.back-btn:hover { background: var(--bg-hover); }
.back-btn svg { width: 20px; height: 20px; }
.tool-title { font-size: 20px; font-weight: 700; }
.tool-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.pw-display {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  position: relative;
}
.pw-output {
  font-family: 'Courier New', monospace;
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  word-break: break-all;
  line-height: 1.4;
  margin-bottom: 12px;
  min-height: 48px;
  display: flex;
  align-items: center;
}
.pw-actions {
  display: flex;
  gap: 8px;
}
.pw-btn {
  flex: 1;
  padding: 10px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.pw-btn:hover {
  background: var(--bg-hover);
  border-color: var(--border-light);
}
.pw-btn.primary {
  background: var(--accent);
  color: var(--bg-primary);
  border-color: var(--accent);
}

.pw-strength {
  margin-bottom: 16px;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}
.pw-strength-bar {
  flex: 1;
  height: 6px;
  background: var(--bg-secondary);
  border-radius: 3px;
  margin: 0 12px;
  overflow: hidden;
}
.pw-strength-fill {
  height: 100%;
  width: 0%;
  border-radius: 3px;
  transition: all 0.3s;
}
.pw-strength-label {
  font-weight: 600;
  font-size: 12px;
}

.pw-options {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.pw-options h3 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 14px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.opt-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.opt-row:last-child { border-bottom: none; }
.opt-label {
  font-size: 14px;
  color: var(--text-primary);
}
.opt-value {
  font-size: 14px;
  color: var(--accent);
  font-weight: 700;
  min-width: 30px;
  text-align: right;
}
input[type="range"] {
  width: 120px;
  accent-color: var(--accent);
  background: transparent;
}
.switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 24px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 24px;
  transition: 0.3s;
}
.slider:before {
  position: absolute;
  content: "";
  height: 16px;
  width: 16px;
  left: 3px;
  bottom: 3px;
  background: var(--text-muted);
  border-radius: 50%;
  transition: 0.3s;
}
input:checked + .slider {
  background: var(--accent);
  border-color: var(--accent);
}
input:checked + .slider:before {
  transform: translateX(20px);
  background: var(--bg-primary);
}
</style>
</head>
<body>

<div class="tool-page">

  <div class="tool-header">
    <a href="../index.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <div>
      <h1 class="tool-title">Password Generator</h1>
      <p class="tool-sub">Bikin password kuat & random</p>
    </div>
  </div>

  <div class="pw-display">
    <div class="pw-output" id="pwOutput">Klik "Generate" untuk mulai</div>
    <div class="pw-actions">
      <button class="pw-btn primary" onclick="generatePassword()">🔄 Generate</button>
      <button class="pw-btn" onclick="copyPassword()">📋 Copy</button>
    </div>
  </div>

  <div class="pw-strength">
    <span class="pw-strength-label" id="strengthLabel">-</span>
    <div class="pw-strength-bar">
      <div class="pw-strength-fill" id="strengthFill"></div>
    </div>
    <span class="pw-strength-label" id="strengthText">-</span>
  </div>

  <div class="pw-options">
    <h3>Pengaturan</h3>
    
    <div class="opt-row">
      <span class="opt-label">Panjang</span>
      <input type="range" id="pwLength" min="4" max="64" value="16" oninput="updateLength(this.value)">
      <span class="opt-value" id="lengthVal">16</span>
    </div>

    <div class="opt-row">
      <span class="opt-label">Huruf Besar (A-Z)</span>
      <label class="switch">
        <input type="checkbox" id="pwUpper" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="opt-row">
      <span class="opt-label">Huruf Kecil (a-z)</span>
      <label class="switch">
        <input type="checkbox" id="pwLower" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="opt-row">
      <span class="opt-label">Angka (0-9)</span>
      <label class="switch">
        <input type="checkbox" id="pwNumber" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="opt-row">
      <span class="opt-label">Simbol (!@#$)</span>
      <label class="switch">
        <input type="checkbox" id="pwSymbol">
        <span class="slider"></span>
      </label>
    </div>
  </div>

</div>

<script>
function updateLength(v) {
  document.getElementById('lengthVal').textContent = v;
}

function generatePassword() {
  const length = parseInt(document.getElementById('pwLength').value);
  const useUpper = document.getElementById('pwUpper').checked;
  const useLower = document.getElementById('pwLower').checked;
  const useNumber = document.getElementById('pwNumber').checked;
  const useSymbol = document.getElementById('pwSymbol').checked;

  const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const lower = 'abcdefghijklmnopqrstuvwxyz';
  const number = '0123456789';
  const symbol = '!@#$%^&*()_+-=[]{}|;:,.<>?';

  let chars = '';
  if (useUpper) chars += upper;
  if (useLower) chars += lower;
  if (useNumber) chars += number;
  if (useSymbol) chars += symbol;

  if (!chars) {
    document.getElementById('pwOutput').textContent = 'Pilih minimal 1 opsi!';
    updateStrength(0);
    return;
  }

  let password = '';
  for (let i = 0; i < length; i++) {
    password += chars.charAt(Math.floor(Math.random() * chars.length));
  }

  document.getElementById('pwOutput').textContent = password;
  updateStrength(calculateStrength(password, useUpper, useLower, useNumber, useSymbol));
}

function calculateStrength(pw, u, l, n, s) {
  let score = 0;
  if (pw.length >= 8) score += 20;
  if (pw.length >= 12) score += 15;
  if (pw.length >= 16) score += 15;
  if (u) score += 15;
  if (l) score += 10;
  if (n) score += 15;
  if (s) score += 10;
  return Math.min(score, 100);
}

function updateStrength(score) {
  const fill = document.getElementById('strengthFill');
  const label = document.getElementById('strengthLabel');
  const text = document.getElementById('strengthText');

  fill.style.width = score + '%';

  let color = '#ef4444';
  let txt = 'Lemah';

  if (score >= 80) { color = '#10b981'; txt = 'Kuat'; }
  else if (score >= 60) { color = '#3b82f6'; txt = 'Baik'; }
  else if (score >= 40) { color = '#f59e0b'; txt = 'Sedang'; }

  fill.style.background = color;
  label.textContent = 'Kekuatan';
  text.textContent = txt;
  text.style.color = color;
}

function copyPassword() {
  const pw = document.getElementById('pwOutput').textContent;
  if (!pw || pw.includes('Klik') || pw.includes('Pilih')) {
    alert('Generate dulu!');
    return;
  }
  navigator.clipboard.writeText(pw).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }).catch(() => {
    alert('Gagal copy, salin manual ya');
  });
}

// Auto-generate saat load
window.addEventListener('load', generatePassword);
</script>
<div class="wenzz-credit">© 2026 WenzZTools • by <span>@WenzZ</span></div>
<script>
  // Auto-sync tema dari homepage
  (function() {
    const saved = localStorage.getItem('wenzz-theme');
    if (saved) {
      document.body.classList.add(saved);
    }
  })();
</script>
</body>
</html>
